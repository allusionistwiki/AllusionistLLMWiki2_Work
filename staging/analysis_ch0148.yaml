  mysteries:
  - kind: mystery
    name: MY_レストロオセ派の政変と王族の病死
    note: レストロオセ派の最高評議会議長が謀略を受け、王族が病死・誘拐されたという情報。これが後の勢力図の変動や、イアテム・ヴァージル陣営との関係性、あるいは「下」の勢力介入の伏線となる。
    quotes:
    - quote: 半年くらい前にジャッフハリム最高評議会議長レストロオセが何らかの謀略を仕掛けられたって情報は掴んでる。それから、同時期に数名の評議員が辞職してることや、呪的財産としての『王族』たちが次々と病死、唯一の生き残りが誘拐されたことも
      paragraph: p5045
    expected_payoff: レストロオセ派の分裂や、誘拐された王族がキーアイテムとして登場し、政治的交渉のカードになる。
  - kind: mystery
    name: MY_墓標船の十二分割と自称シナモリアキラ
    note: 墓標船の情報が十二分割され、各地に拡散されたこと。これにより「自称シナモリアキラ」が出現し、アキラとの対決が不可避となる。
    quotes:
    - quote: 大まかに十二分割されて第五階層の各地に拡散されているみたい。さいわい各地の監視網が何人かの『自称シナモリアキラ』たちの動向を捕捉できたから、現在追跡中だよ
      paragraph: p5047
    expected_payoff: 各分割された情報を持つ敵との個別戦闘、あるいはそれらが合体して強力な敵となる展開。
  - kind: mystery
    name: MY_カーインの正体と吸血鬼説
    note: カーインが吸血鬼であるか否かを曖昧にし、混血の可能性を示唆している。彼の瘴気能力の制限と正体が今後の戦力バランスに影響する。
    quotes:
    - quote: そもそも奴が吸血鬼だったということが初耳だったのだが、カーインは何故か肯定も否定もせず「まあそんなようなものだ」と言葉を濁した。
      paragraph: p5039
    expected_payoff: カーインの真の能力解放、あるいは彼が敵側に寝返る・正体がバレて孤立するなどのドラマ。
  - kind: mystery
    name: MY_ヴァージルの見逃しの真意
    note: ヴァージルがアキラたちを見逃した理由が「パーンの動き制限」か「汚染の自信」かの二択で示唆されているが、真意は不明。
    quotes:
    - quote: あのとき、ヴァージルは私たちを見逃した。アルトがすぐ近くに迫っていたっていうのもあるだろうけど、何かの狙いがあると見るべきだろうね
      paragraph: p5042
    expected_payoff: ヴァージルがアキラを意図的に育てている、あるいはトリシューラを支配するための罠であることが判明する。
  - kind: mystery
    name: MY_コルセスカの囚われと陽根の要塞
    note: コルセスカがヴァージルとイアテムの根城である「巨大な陽根」に捕らわれている。この場所が異界化しており、救出が困難であることが強調されている。
    quotes:
    - quote: 捕らわれたコルセスカはヴァージルとイアテムの根城、巨大な陽根の中だ。存在そのものが護符として機能するあの下品な塔はそのばかげた外見からは想像もつかないほど合理的な呪術要塞であり、
      paragraph: p5043
    expected_payoff: 陽根への潜入作戦、コルセスカの救出、あるいは彼女が敵側として再登場する可能性。
  themes:
  - kind: theme
    theme: アイデンティティの希薄化と「本物」への渇望
    weight: 0.9
    quotes:
    - quote: サイバーカラテランキング、かなり変動しているらしいな。何でも、『俺』は称号扱いで、最強のサイバーカラテユーザーを目指す奴らが『シナモリアキラ』を自称しているとか。
      paragraph: p5047
    - quote: 『杖』の紀人としては失格だね。他の自称シナモリアキラも同じ。偽物にすらなれてないんだよ、貴方たちは。出直してきて
      paragraph: p5049
    note: 名前や称号が流通し、本物と偽物の境界が曖昧になる中で、アキラが「俺こそが本物」と証明しようとする心理的葛藤が主題。
  - kind: theme
    theme: 暴力の消費財化と倫理の崩壊
    weight: 0.8
    quotes:
    - quote: 命とは大量浪費と大量死を繰り返す安上がりな消費財だ！
      paragraph: p5050
    - quote: 欲望は生物としての正常な本能なんだから
      paragraph: p5049
    note: アキラが暴走し、命を消費財と見なす極端なニヒリズムに陥ることで、戦争や暴力の非人間性を描く。
  - kind: theme
    theme: 技術と呪術の融合による戦争のモジュール化
    weight: 0.7
    quotes:
    - quote: 戦争行為を高度にモジュール化することが可能となった。ルバーブを中心として有機的な連携を行う精鋭部隊は今のところ負け知らずであり、
      paragraph: p5042
    - quote: 戦闘用ドローン五千機、純戦闘スタッフ二百人――これでも『最大効率で運用できた場合』って但し書きが付く。
      paragraph: p5040
    note: 近代的な軍事理論（モジュール化、ドローン、PMC）とファンタジー的な呪術が融合し、戦争がシステムとして最適化されていく様。
  - kind: theme
    theme: 信頼と支配の境界線
    weight: 0.6
    quotes:
    - quote: お前はこの数ヶ月、俺の信頼に甘え、抑圧し、従属を強いて、犬の如き屈辱を味わわせてくれた。
      paragraph: p5049
    - quote: それを赦せるのがアキラくんなの。『Ｅ－Ｅ』の制御下にない暴走したアストラル体なんて、もうアキラくんじゃないよ
      paragraph: p5049
    note: トリシューラとアキラの関係性が、信頼に基づく協力から、支配と被支配、そして精神的な暴力へと変質していく過程。
