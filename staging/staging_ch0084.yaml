- canonical_target: '[[E_term_探索者の城]]'
  entity_type: terminology
  aspects:
    visual:
      observations:
      - event_ref: E_ch0084_探索者の城_is_located_ガロアンディアン_p3093
        quote: 探索者――それもとある集団の拠点としてトリシューラが用意した、ガロアンディアンの内部に存在する『城』。 事実上の治外法権であるそこは、『自由』を己の信条とする者たちが集う宿であり食堂であり、更には地上にある探索者協会の支部の一つでもある。
        locator: {}
        spoiler_after: ch0084
